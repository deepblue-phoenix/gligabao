# gligabao configuration
port = 7878

# API keys default to the ANTHROPIC_API_KEY / OPENAI_API_KEY / PINECONE_API_KEY environment variables;
# a value set here overrides the environment.
# anthropic_api_key = ""
# openai_api_key = ""   # required: remember embeds what it stores with it, and query embeds the question; the server does not start without it

# Main database backend: "sqlite" (default; the file is set with `serve --db`) or "postgres".
db_backend = "sqlite"
# PostgreSQL connection string, required when db_backend = "postgres" (also settable with POSTGRES_DSN).
# postgres_dsn = "postgres://user:password@localhost:5432/gligabao?sslmode=disable"

# Vector store for embeddings: "chromem" (default; chromem-go, pure Go, a local directory next to the main
# database, see `serve --vector-dir`) "pinecone" or "s3vectors" (an Amazon S3 vector bucket).
vector_store = "chromem"
# Embedding size (text-embedding-3-small = 1536); also the output size requested from OpenAI. Fixed when the
# chromem vector store is created; a Pinecone index must be created with the same dimension.
embedding_dimensions = 1536

# Pinecone settings (used when vector_store = "pinecone"). The host is the index's data-plane host from the
# Pinecone console (also settable with PINECONE_INDEX_HOST). Leave unset to disable.
# pinecone_api_key = ""
# pinecone_index_host = "my-index-abc123.svc.aped-1234.pinecone.io"

# Amazon S3 Vectors settings (used when vector_store = "s3vectors"; see docs/s3-vectors.md). The vector bucket must exist.
# Credentials come from the standard AWS chain (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, ~/.aws, IAM role), not from this file.
# Each dataset is one index of the bucket named "<prefix>.<dataset>", so the prefix works as a subdirectory: deployments
# (prod, staging, a project) can share one bucket. Also settable with S3_VECTORS_BUCKET / S3_VECTORS_REGION / S3_VECTORS_PREFIX.
# s3_vectors_bucket = "my-gligabao-vectors"
# s3_vectors_region = "us-east-1"
# s3_vectors_prefix = "prod"

# Where image files are kept: "fs" (default; a directory, `serve --image-dir`, by default next to the database) or "s3"
# (an existing Amazon S3 bucket). Credentials come from the standard AWS chain, not from this file. Images are stored as
# "<prefix>/<dataset id>/<sha256>.<ext>". Also settable with IMAGE_STORE / IMAGE_S3_BUCKET / IMAGE_S3_REGION /
# IMAGE_S3_PREFIX / IMAGE_S3_ENDPOINT (a custom endpoint such as MinIO or LocalStack).
# image_store = "s3"
# image_s3_bucket = "my-gligabao-images"
# image_s3_region = "us-east-1"
# image_s3_prefix = "prod"
# image_s3_endpoint = ""

# Ontology documents are also stored in S3 when ontology_s3_bucket is set (an existing bucket; no fallback to any other bucket). Without
# it ontologies are kept only in the database. Each user has a directory:
# "<prefix>/<user>/<ontology name>/<timestamp>_<load|merge|replace>.owl". Also settable with ONTOLOGY_S3_BUCKET / _REGION / _PREFIX.
# ontology_s3_bucket = "my-gligabao-ontologies"
# ontology_s3_region = "us-east-1"
# ontology_s3_prefix = "ontologies"

# ATIF traces (trajectories): with atif_s3_bucket set (an existing Amazon S3 bucket; credentials from the standard AWS chain) they are
# stored there, one directory per user: "<prefix>/<user>/<creation timestamp>_<trajectory_id>.json". Without it they are JSON files in
# the trajectory directory (`serve --trajectory-dir`). No other switch, no fallback to any other bucket. With a bucket the server's
# research agents also record a trace of every research. Also settable with ATIF_S3_BUCKET / ATIF_S3_REGION / ATIF_S3_PREFIX / ATIF_S3_ENDPOINT.
# atif_s3_bucket = "my-gligabao-traces"
# atif_s3_region = "us-east-1"
# atif_s3_prefix = "traces/atif"
# atif_s3_endpoint = ""

# Long texts: remember splits a text of more than chunk_size tokens into chunks (at paragraph boundaries, with
# chunk_overlap_percent of each chunk repeated at the start of the next) and extracts, stores and embeds each chunk on
# its own. See docs/chunking.md.
chunk_size = 1024
chunk_overlap_percent = 20

# Register the training endpoints (/v1/gb/training/...: jobs, models, datasets, evals, audits, progress feed) and start
# the training monitor. Default false (not needed, and better off, in deployments that do not train);
# `serve --training` turns it on.
training = false

# Serve the admin UI at /v1/gb/admin/ (the web assets are embedded in the binary when built with ./run_build.sh).
# Default false; `serve --admin-ui` turns it on.
admin_ui = false

# Make remember find the places among the entities it extracts (cities, countries, regions, landmarks, ...) and store their
# coordinates (table gb_entity_geo), using the public Nominatim geocoder of OpenStreetMap. It costs one more LLM call per text and
# sends the names of places to the geocoder. Default false; `serve --geo` turns it on.
geo = false

# The default radius, in kilometers, of the nearby search of `query`: with geo on, and only when a request asks for it
# (geo_nearby: true, or geo_radius_km), the LLM that answers gets the geo entities within this distance of the places of the
# question (the entities that match it and the places it mentions). A request can override it with geo_radius_km.
# Default 50; at most 20015.
geo_radius_km = 50

# Serve remember and query as MCP (Model Context Protocol) tools at /v1/gb/mcp (streamable HTTP transport), so MCP clients (Claude
# Desktop, Claude Code, ...) can use gligabao as a memory. There is NO authentication yet: callers choose the user_id themselves, so
# enable it only on a trusted network. Default false; `serve --mcp` turns it on.
mcp = false

# Start the sargo model router that is embedded in the binary (built with ./run_build.sh --sargo) as a child process of `serve`, stopped with
# it; sargo gets the Anthropic and OpenAI keys of this config. The server does not start if the binary has no sargo. Default false;
# `serve --sargo` turns it on.
sargo = false
# A sargo config file to use instead of the default one embedded in the binary (relative to this file). Its [server] address is where
# sargo listens (default 127.0.0.1:8431). `gligabao sargo config` prints the default.
# sargo_config = "sargo.toml"
# Directory sargo saves the per-user GCNII* models in (one subdirectory per user; trained with POST /v1/gb/training/gcnii/train, used by
# /v1/gb/training/gcnii/infer and /embed). Relative to this file. Default: a gcnii_models directory in the working directory.
# sargo_gcnii_dir = "gcnii_models"

# Directory the files of trained models are fetched to for a deployment, one subdirectory per training job (gligabao
# never deletes them). Default: a trained_models directory next to the database file (build/trained_models).
# `serve --trained-model-deploy-dir` overrides it.
# trained_model_deploy_dir = "trained_models"

# Content directories. Each is a list of directories, searched in order; a relative path is relative to THIS FILE (not to the working
# directory). A program that embeds gligabao can list its own directories next to (or before) these, e.g. its own first and then
# "../../gligabao/build/datasets_training". When a name (a dataset, an eval) is in more than one directory, the first one wins.
# The command-line flags (--training-dataset-dir, --training-eval-dir, --ontology-dir, repeatable; the eval runners' -evals) override them.

# Training datasets: one subdirectory with a dataset.toml manifest per dataset. Uploads are saved in the FIRST directory; the others are read only.
# Default if unset: a datasets_training directory next to the database file.
datasets_training_dirs = ["datasets_training"]

# Evals of trained models (training evals): one JSON file per eval. Default if unset: an evals_training directory next to the database file.
evals_training_dirs = ["evals_training"]

# Knowledge evals: one JSON file per eval, and the corpus files their cases refer to with text_file (looked up in these directories in order).
# Read by the eval runner (./run_evals.sh), not by the server. Default if unset: build/evals_knowledge.
evals_knowledge_dirs = ["evals_knowledge"]

# Per-user evals (the /v1/gb/evals routes; always on). The eval files of each user are JSON files "<prefix>/<user>/<name>.json" and
# the corpus files they name, in the meta bucket when evals_s3_bucket is set (an existing bucket; no fallback to another bucket).
# Without a bucket they are in a local directory, one subdirectory per user: evals_local_dir (default: evals_user next to the database).
# Also settable with EVALS_S3_BUCKET / EVALS_S3_REGION / EVALS_S3_PREFIX / EVALS_S3_ENDPOINT.
# evals_s3_bucket = "my-gligabao-meta"
# evals_s3_region = "us-east-1"
# evals_s3_prefix = "evals"
# evals_s3_endpoint = ""
# evals_local_dir = "evals_user"
# Weights of the trained models that are not kept on the sidecar (the GCNII* models of sargo). Every trained model has a row in
# gb_trained_models; its weights are the objects "<prefix>/<model type>/<user>/<job id>/<file>" (e.g. model_weights/gcnii/<user>/<job id>/
# model.weights) of model_weights_s3_bucket (an existing bucket, normally the meta bucket). Without a bucket they are in a local directory,
# model_weights_local_dir (default: model_weights in the working directory). Also settable with MODEL_WEIGHTS_S3_BUCKET / _REGION / _PREFIX / _ENDPOINT.
# model_weights_s3_bucket = "my-gligabao-meta"
# model_weights_s3_region = "us-east-1"
# model_weights_s3_prefix = "model_weights"
# model_weights_s3_endpoint = ""
# model_weights_local_dir = "model_weights"
# The trajectories of the eval runs are kept here when there is no ATIF bucket (default: an atif directory next to the database).
# evals_trajectory_dir = "atif"

# Limits of an eval, with their defaults: cases per eval, bytes of its JSON file, bytes of one text or corpus file.
# evals_max_cases = 100
# evals_max_file_bytes = 1048576
# evals_max_text_bytes = 262144
# Eval runs in progress at once, per user and on this server.
# evals_max_runs_per_user = 2
# evals_max_runs = 8
# Cost caps in USD: a run stops once its cases cost more than evals_max_run_cost_usd; a user's runs past evals_max_user_cost_usd_per_day
# in the last 24 hours are refused.
# evals_max_run_cost_usd = 5
# evals_max_user_cost_usd_per_day = 20
# Days after a run ended that its eval datasets (the graphs its cases built) are kept before they are deleted.
# evals_dataset_retention_days = 14
# A running eval run records that it is alive every evals_heartbeat_interval; a run without a beat for evals_heartbeat_stale is stale
# (its server crashed) and is recovered as errored.
# evals_heartbeat_interval = "15s"
# evals_heartbeat_stale = "2m"

# Ontologies: directories of OWL documents (RDF/XML). Nothing is loaded at startup: a request to POST /v1/gb/ontologies (or PUT
# /v1/gb/ontologies/{name}) with "file": "market.owl" instead of "content" loads that file, the first one of these directories that has it,
# under the requesting user_id. Default if unset: none (only "content" works).
ontology_dirs = ["ontology"]

# Definitions of the research agents (docs/agents/agent-defs.md): one TOML or JSON file per agent (prompt, skills, search and knowledge settings,
# cost caps, sub-agent roles), read once at startup; a file that is not valid stops the server. Default if unset: "agent_defs" next to the
# binary (it need not exist: only the built-in agent is then available). Relative to this file.
agent_defs_dir = "agent_defs"
# Where the notes files of the investigative research loop go (notes_<user>_<run>_<notes_id>.md); only agents with loop = "investigative" write there.
# Default: a research_notes directory next to the binary.
# research_notes_dir = "research_notes"
# The code sandbox (Pydantic Monty) of the investigative agents with [code] enabled in their definition (docs/agents/monty-code-execution.md).
# Needs `pip install pydantic-monty`: monty_python is the interpreter that has it (also GLIGABAO_MONTY_PYTHON, default python3), monty_bin the
# worker binary (also MONTY_BIN, default: next to the interpreter, then PATH). Workers: the most worker processes; the timeout kills a stuck one.
# monty_python = "/opt/monty/bin/python"
# monty_bin = "/opt/monty/bin/monty"
# monty_workers = 2
# monty_request_timeout_s = 90
# Also store those notes in an (existing) Amazon S3 bucket, the research bucket common to all the research agents (also RESEARCH_S3_BUCKET,
# _REGION, _PREFIX). The local files stay the working copy and every write is mirrored to s3://<bucket>/<prefix>/<user>/notes_<user>_<run>_<notes_id>.md;
# a notes file missing locally is read back from the bucket. Credentials: the default AWS chain (instance role). Default: off, local files only.
# research_s3_bucket = "gligabao-int-research-dev"
# research_s3_region = "us-east-1"
# research_s3_notes_prefix = "research/investigative_notes"

# The most one research (all its agents together) may spend, in USD, whatever its agent definition and request say: they can only lower it.
# When it is reached the agents write their reports and say so. 0 (default): no cap of the server.
# research_max_cost_usd = 5.0

# The default services of the research agents' web tools, when the request names none (search_provider, fetch_provider of POST /v1/gb/research).
# Search: "anthropic" (default, Anthropic's cloud web search). Fetch: "local" (default, a plain HTTP GET from the server). Others come later.
# research_search_provider = "anthropic"
# research_fetch_provider = "local"

# Model prices in USD per 1M tokens, used to compute the cost of each LLM call (stored with each inference in gb_inferences).
# Keys are model-name prefixes: the longest matching prefix wins, so "claude-haiku-4-5" also matches
# "claude-haiku-4-5-20251001". Entries here override the built-in prices or add new models.
# cache_write / cache_read are optional and default to `input`.
# long_threshold / long_input / long_output are optional: when a call's total input tokens (including cache)
# exceed long_threshold, the whole call is billed at long_input / long_output instead of input / output.
[prices."claude-haiku-5-5"]
input = 0.1
output = 0.5
cache_write = 0.125
cache_read = 0.01
long_threshold = 100000
long_input = 0.5
long_output = 2.5

[prices."claude-fable-5-1"]
input = 10.0
output = 50.0
cache_write = 12.5
cache_read = 0.25

[prices."claude-opus-5-5"]
input = 4.0
output = 20.0
cache_write = 5.0
cache_read = 0.2

[prices."claude-sonnet-5-5"]
input = 2.0
output = 10.0
cache_write = 2.5
cache_read = 0.1

[prices."claude-haiku-4-5"]
input = 1.0
output = 5.0
cache_write = 1.25
cache_read = 0.1

[prices."claude-sonnet-4-5"]
input = 3.0
output = 15.0
cache_write = 3.75
cache_read = 0.3

[prices."claude-opus-4-5"]
input = 5.0
output = 25.0
cache_write = 6.25
cache_read = 0.5

[prices."text-embedding-3-small"]
input = 0.02
output = 0.0
