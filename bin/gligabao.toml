# gligabao configuration
port = 7878

# API keys default to the ANTHROPIC_API_KEY / OPENAI_API_KEY / PINECONE_API_KEY environment variables;
# a value set here overrides the environment.
# anthropic_api_key = ""
# openai_api_key = ""   # used by remember to embed entities and edges; without it no vectors are stored

# Main database backend: "sqlite" (default; the file is set with `serve --db`) or "postgres".
db_backend = "sqlite"
# PostgreSQL connection string, required when db_backend = "postgres" (also settable with POSTGRES_DSN).
# postgres_dsn = "postgres://user:password@localhost:5432/gligabao?sslmode=disable"

# Vector store for embeddings: "chromem" (default; chromem-go, pure Go, a local directory next to the main
# database, see `serve --vector-dir`) or "pinecone".
vector_store = "chromem"
# Embedding size (text-embedding-3-small = 1536); also the output size requested from OpenAI. Fixed when the
# chromem vector store is created; a Pinecone index must be created with the same dimension.
embedding_dimensions = 1536

# Pinecone settings (used when vector_store = "pinecone"). The host is the index's data-plane host from the
# Pinecone console (also settable with PINECONE_INDEX_HOST). Leave unset to disable.
# pinecone_api_key = ""
# pinecone_index_host = "my-index-abc123.svc.aped-1234.pinecone.io"

# Long texts: remember splits a text of more than chunk_size tokens into chunks (at paragraph boundaries, with
# chunk_overlap_percent of each chunk repeated at the start of the next) and extracts, stores and embeds each chunk on
# its own. See docs/chunking.md.
chunk_size = 1024
chunk_overlap_percent = 20

# Register the eval endpoints (POST /v1/gb/eval/remember, /v1/gb/eval/recall), which return ATIF trajectories
# with their results. Default false; `serve --eval` turns it on.
eval = false

# Register the training endpoints (/v1/gb/training/...: jobs, models, datasets, evals, audits, progress feed) and start
# the training monitor. Default false (not needed, and better off, in deployments that do not train);
# `serve --training` turns it on.
training = false

# Serve the admin UI at /v1/gb/admin/ (the web assets are embedded in the binary when built with ./run_build.sh).
# Default false; `serve --admin-ui` turns it on.
admin_ui = false

# Directory the files of trained models are fetched to for an export, one subdirectory per training job (gligabao
# never deletes them). Default: a trained_models directory next to the database file (bin/trained_models).
# `serve --trained-model-export-dir` overrides it.
# trained_model_export_dir = "trained_models"

# Model prices in USD per 1M tokens, used to compute the cost of each LLM call (stored with each inference in gb_inferences).
# Keys are model-name prefixes: the longest matching prefix wins, so "claude-haiku-4-5" also matches
# "claude-haiku-4-5-20251001". Entries here override the built-in prices or add new models.
# cache_write / cache_read are optional and default to `input`.
# long_threshold / long_input / long_output are optional: when a call's total input tokens (including cache)
# exceed long_threshold, the whole call is billed at long_input / long_output instead of input / output.
[prices."claude-haiku-5-5"]
input = 0.1
output = 0.5
cache_write = 0.125
cache_read = 0.01
long_threshold = 100000
long_input = 0.5
long_output = 2.5

[prices."claude-haiku-4-5"]
input = 1.0
output = 5.0
cache_write = 1.25
cache_read = 0.1

[prices."claude-sonnet-4-5"]
input = 3.0
output = 15.0
cache_write = 3.75
cache_read = 0.3

[prices."claude-opus-4-5"]
input = 5.0
output = 25.0
cache_write = 6.25
cache_read = 0.5

[prices."text-embedding-3-small"]
input = 0.02
output = 0.0
