# Runs the gligabao server. In training mode it starts the Python ML sidecar itself, inside the same container (the image has it), and
# forwards its stdout/stderr to its own (ml_sidecar_forward_logs), so `docker compose logs` shows both.
#
#   export ANTHROPIC_API_KEY=...     # required for remember/query
#   export OPENAI_API_KEY=...        # required: embeddings (remember embeds what it stores, query the question)
#   docker compose up --build
#
# Server:  http://127.0.0.1:7878   (GET /health)

services:
  gligabao:
    build:
      context: .
      dockerfile: Dockerfile
    image: gligabao:latest
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The ML sidecar (training) needs the Modal credentials.
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      # SQLite db, vector store and images (/data in the image).
      - gligabao-data:/data
    restart: unless-stopped

volumes:
  gligabao-data:
