# sargo configuration. Read at start-up from ./config.toml, or from the path in $SARGO_CONFIG
# (or the first command line argument). Every key is optional; the values below are the defaults.

#-------------------------------------------------------------
[server]
# Address to listen on.
address = "127.0.0.1:8431"

# Seconds to wait for a client that stops sending.
read_timeout_secs = 30

# Refuse request bodies larger than this many bytes (10 MB).
max_body_bytes = 10485760

[http_client]
# Seconds to wait for a model provider to answer (models can be slow).
timeout_secs = 300

# A provider is enabled when the environment variable named in `api_key_env` is set and not empty.
# API keys are never stored in this file. At least one provider must be enabled.
[providers.anthropic]
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

[providers.openai]
base_url = "https://api.openai.com"
api_key_env = "OPENAI_API_KEY"
