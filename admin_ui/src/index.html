<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gligabao admin</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="d3.min.js"></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>gligabao <span class="muted">admin</span></h1>
      <span id="health" class="badge badge-unknown">checking…</span>
    </header>

    <main>
      <form id="datasets-form" class="row">
        <label class="check"><input type="checkbox" id="include-deleted" /> include deleted datasets</label>
        <button type="submit">Refresh</button>
      </form>
      <div id="databases"></div>
    </main>

    <dialog id="graph-modal" class="modal">
      <div class="modal-head">
        <h2 id="graph-title">Graph</h2>
        <span id="graph-status" class="muted"></span>
        <button type="button" id="graph-close">Close</button>
      </div>
      <div id="graph-canvas"></div>
    </dialog>
  </body>
</html>
