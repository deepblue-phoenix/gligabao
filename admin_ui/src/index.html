<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gligabao admin</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>gligabao <span class="muted">admin</span></h1>
      <span id="health" class="badge badge-unknown">checking…</span>
    </header>

    <main>
      <section class="card">
        <h2>Datasets</h2>
        <form id="datasets-form" class="row">
          <input id="user-id" name="user_id" placeholder="user id" autocomplete="off" required />
          <label class="check"><input type="checkbox" id="include-deleted" /> include deleted</label>
          <button type="submit">Load</button>
        </form>
        <p id="datasets-status" class="muted"></p>
        <table id="datasets-table" hidden>
          <thead>
            <tr><th>Name</th><th>Description</th><th>Tags</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
