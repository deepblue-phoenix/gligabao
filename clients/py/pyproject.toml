[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gligabao"
version = "0.7.0"
description = "Python client for the gligabao server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/gligabao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
