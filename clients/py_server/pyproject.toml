[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gligabao-server"
dynamic = ["version"]
description = "The gligabao server (a prebuilt Go binary) for pip"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gligabao-server = "gligabao_server:main"
gligabao = "gligabao_server:main"

# The version is the gligabao server version (the VERSION file of the repo). run_pypi.sh writes it into
# _version.py of the staging directory it builds in; the value in the tree is a placeholder.
[tool.hatch.version]
path = "src/gligabao_server/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gligabao_server"]
# _bin/ (the binary and gligabao.toml) is generated by run_pypi.sh and is not in git.
artifacts = ["src/gligabao_server/_bin/*"]

# Sets the platform tag of the wheel (from GLIGABAO_WHEEL_TAG); see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
